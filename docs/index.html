<!DOCTYPE html>
<html> 
<head> 
    <title>Defeating ftrace based LKM rootkits for fun and profit</title> 
    <style>
         /* Allow the main webpage window to scroll naturally */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            background-color: #f4f4f4; 
            display: flex;
            justify-content: center; 
        }

        /* Container scales to the exact size of the text file */
        .text-frame {
            width: 90%;
            height: 100%; /* Spans the full height of the text content */
            min-height: 95vh;
            border: none;
            
            /* Completely kills the inner scrollbar */
            overflow: hidden; 
        }
    </style>
</head> 
<body>

    <!-- Setting scrolling="no" strips the inner scrollbar entirely -->
    <iframe class="text-frame" src="./text.txt" scrolling="no"></iframe>

</body>
</html>
