<!DOCTYPE html>
<html> 
<head> 
    <title>Defeating ftrace based LKM rootkits for fun and profit</title> 
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            background-color: #ffffff; 
            display: grid;
            justify-items: center; 
        }

        /* Object tags respect flex/grid height calculations better than iframes */
        .text-frame {
            width: 90%;
            min-height: 100vh;
            display: block;
            border: none;
        }
    </style>
</head> 
<body>

    <!-- Notice this is an OBJECT tag, not an IFRAME tag -->
    <object class="text-frame" data="./text.txt" type="text/plain"></object>

</body>
</html>
