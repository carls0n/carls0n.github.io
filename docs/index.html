<!DOCTYPE html>
<html> 
<head> 
    <title>Defeating ftrace based LKM rootkits for fun and profit</title> 
    <style>
        /* Allow the outer window to scroll naturally */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: auto; 
            background-color: #ffffff; 
            display: grid;
            justify-items: center; 
        }

        /* The object tag will expand to the text length without clipping */
        .text-frame {
            width: 90%;
            height: auto; 
            min-height: 100vh; /* Ensures it takes up at least the whole screen */
            display: block;
            border: none;
            overflow: hidden;
        }
    </style>
</head> 
<body>

    <!-- Replacing iframe with object allows the page to grow naturally -->
    <iframe class="text-frame" src="./text.txt" scrolling="no"></iframe>

</body>
</html>
